<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe"></stop>
      <stop offset="100%" stop-color="#4facfe"></stop>
    </radialGradient>
  </defs>

  <!-- outer glow ring -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#00f2fe" stroke-opacity="0.2" stroke-width="2"></circle>

  <!-- radar waves -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#4facfe" stroke-opacity="0.4" stroke-width="2"></circle>
  <circle cx="50" cy="50" r="18" fill="none" stroke="#00f2fe" stroke-opacity="0.6" stroke-width="2"></circle>

  <!-- center pulse -->
  <circle cx="50" cy="50" r="6" fill="url(#g)"></circle>

  <!-- location pointer -->
  <path d="M50 15 L55 30 L50 26 L45 30 Z" fill="#f093fb"></path>
</svg>